name: Build Fiji JAR

on:
  push:
    branches: [main]
    paths:
      - 'spool-fiji/**'
      - '.github/workflows/build-fiji-jar.yml'
  pull_request:
    paths:
      - 'spool-fiji/**'
      - '.github/workflows/build-fiji-jar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install OpenCL reference runtime for numerical tests
        run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd

      - name: Build and test Fiji plugin JAR
        run: mvn -B -f spool-fiji/pom.xml clean verify -Dspool.test.opencl=true -Dspool.test.cpuOnly=true

      - name: Show built JAR
        run: ls -lh spool-fiji/target/*.jar

      - name: Upload Fiji JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spool-fiji-jar
          path: |
            spool-fiji/target/spool_fiji-*.jar
            !spool-fiji/target/*-sources.jar
            !spool-fiji/target/*-tests.jar
            !spool-fiji/target/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30
