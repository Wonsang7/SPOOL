name: Release Fiji Update Site

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIJI_DOWNLOAD_URL: https://downloads.imagej.net/fiji/stable/fiji-stable-linux64-jdk.zip
      UPDATE_SITE: SPOOL
      UPDATE_USER: Wonsang7
      UPDATE_PASS: ${{ secrets.UPDATE_PASS }}
      # Preserve the existing public updater entry so installed copies upgrade
      # in place. The JAR's internal Maven version is the actual release version.
      UPDATE_JAR: plugins/spool_fiji-0.1.2-SNAPSHOT.jar

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install OpenCL reference runtime for numerical tests
        run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd

      - name: Build and test SPOOL Fiji plugin
        run: mvn -B -f spool-fiji/pom.xml clean verify -Dspool.test.opencl=true -Dspool.test.cpuOnly=true

      - name: Verify upload secret
        shell: bash
        run: |
          if [ -z "${UPDATE_PASS}" ]; then
            echo "Missing repository secret: UPDATE_PASS"
            exit 1
          fi

      - name: Install Fiji and configure SPOOL update site
        shell: bash
        run: |
          curl -fsSL "${FIJI_DOWNLOAD_URL}" -o fiji-linux64.zip
          unzip -q fiji-linux64.zip
          chmod +x Fiji.app/fiji Fiji.app/fiji-linux-x64

          ./Fiji.app/fiji --java-home "${JAVA_HOME}" --headless --update edit-update-site \
            "${UPDATE_SITE}" \
            "https://sites.imagej.net/${UPDATE_SITE}/" \
            "webdav:${UPDATE_USER}:${UPDATE_PASS}" \
            .

          # Synchronize Fiji, including the current SPOOL update-site metadata,
          # before replacing the plugin. This keeps the remote file history intact.
          ./Fiji.app/fiji --java-home "${JAVA_HOME}" --headless --update update

      - name: Install release JAR into Fiji
        shell: bash
        run: |
          JAR="$(find spool-fiji/target -maxdepth 1 -type f -name 'spool_fiji-*.jar' \
            ! -name '*sources*' ! -name '*javadoc*' ! -name '*-tests.jar' | head -n 1)"
          if [ -z "${JAR}" ]; then
            echo "Built SPOOL JAR not found"
            exit 1
          fi

          mkdir -p Fiji.app/plugins
          rm -f Fiji.app/plugins/spool_fiji*.jar
          cp "${JAR}" "Fiji.app/${UPDATE_JAR}"
          ls -lh "Fiji.app/${UPDATE_JAR}"

      - name: Preview SPOOL update-site upload
        working-directory: Fiji.app
        run: |
          ./fiji --java-home "${JAVA_HOME}" --headless --update upload --simulate \
            --update-site "${UPDATE_SITE}" \
            --force-shadow \
            "${UPDATE_JAR}"

      - name: Publish SPOOL to Fiji update site
        working-directory: Fiji.app
        run: |
          ./fiji --java-home "${JAVA_HOME}" --headless --update upload \
            --update-site "${UPDATE_SITE}" \
            --force-shadow \
            "${UPDATE_JAR}"
